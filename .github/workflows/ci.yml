name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: 后端（测试 + 架构红线）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: 依赖
        run: go mod download

      - name: 编译
        run: go build ./...

      - name: 静态检查
        run: go vet ./...

      # 让架构约束可执行，而不是靠自觉（架构书 7.1）
      - name: 架构红线 R1/R2/R3
        run: make lint-arch

      - name: 单元测试
        run: go test ./... -count=1

      - name: 领域层覆盖率（目标 ≥ 80%）
        run: go test ./internal/domain/... -coverprofile=coverage.out -covermode=count

      - name: 覆盖率摘要
        run: go tool cover -func=coverage.out | tail -3

      # P2P 的逻辑最容易错，也最需要畸形输入兜底
      - name: 协议 fuzz（短跑）
        run: go test ./internal/domain/protocol/ -run='^$' -fuzz=FuzzRead -fuzztime=15s

      - name: 上传覆盖率
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      # 注意：这一步【不】需要 Go 工具链（绑定时运行时动态加载）
      - name: 构建
        run: npm run build
