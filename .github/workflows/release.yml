name: Release

# 三平台客户端打包。
#
# 为什么必须用 CI 而不能在 Windows 上一把梭（这不是配置问题，是工具链约束）：
#   - macOS 的 create:dmg 任务本身写了 platforms: [darwin]，非 macOS 上会被直接跳过；
#     .app 的合成还依赖 codesign，跨平台产物必被 Gatekeeper 拦。
#   - Linux 的 AppImage/deb/rpm 打包依赖目标平台的工具链（linuxdeploy、nfpm 等）。
# 所以这里用三个原生 runner 各出各的，只有 macOS 那条能产出可发布的 dmg。
#
# 触发方式：
#   - push tag（v*）→ 打包并创建 GitHub Release
#   - 手动 workflow_dispatch → 只打包并上传 artifact，不发 Release
#
# 发布说明：Release 正文来自仓库根目录的 CHANGELOG.md，按 tag 名整段取。
# 不用 gh 的 --generate-notes：本仓直接往主分支提交、提交信息是给人读的长句，
# 自动生成的「提交列表」对用户没有任何意义，而缺了小节时它还会悄悄退化成
# 一份空说明 —— 那正是「发版了但没人知道改了什么」的成因。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# gh release create 需要写权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # ⚠ 这一行是整个工作流里最容易漏、也最致命的一行。
  #
  # main_wails.go 带 `//go:build wails`，而 build/*/Taskfile.yml 的生产 BUILD_FLAGS
  # 只有 `-tags production`；wails3 CLI 也不会替我们补这个 tag
  # （internal/commands/task_wrapper.go 只在 -tags 非空时才设 EXTRA_TAGS）。
  # 少了它，产物是 2.4MB 的占位程序（运行时只打印"未启用 wails tag"），
  # 却仍会被正常打包成安装包 —— 构建报成功、装上去打不开。
  #
  # 必须用【环境变量】而不是 `wails3 build -tags wails`：
  # wails3 package 的参数里根本没有 tags 这一项（Package 的签名忽略它），
  # 只有环境变量能穿透到 package → create:nsis:installer → deps: build
  # 这条嵌套调用链里的每一层。
  EXTRA_TAGS: wails

jobs:
  package:
    name: package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不要连坐另外两个：否则你永远只能看到第一个错误
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-amd64
            task: windows:package
          - os: macos-latest
            label: macos-universal
            # universal = arm64 + amd64，用 lipo 合成一份，Intel 与 Apple Silicon 通吃
            task: darwin:package:universal
          - os: ubuntu-latest
            label: linux-amd64
            task: linux:package

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 直接读 go.mod（go 1.25.0），避免版本在两处各写一遍后悄悄漂移
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          # 版本来源统一为 frontend/.nvmrc，避免与 ci.yml 各写一份后悄悄漂移。
          # （打包本身只需要 Vite，不依赖 Node 的类型擦除；但"两处各写一个版本号"
          #  正是本项目反复吃过亏的那类分叉。）
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---------------------------------------------------------------- 平台依赖

      - name: 安装 Linux 构建依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Wails v3 的 Linux 后端在 beta.24 已从 GTK3 迁到 GTK4：
          # internal/operatingsystem 里的 cgo 指令要求 pkg-config 能解析
          # `gtk4` 与 `webkitgtk-6.0`（GTK4 版 WebKit，注意名字里没有 "2"）。
          # 装 libgtk-3-dev + libwebkit2gtk-4.1-dev 一个都顶不上，
          # 报错形如 "Package gtk4 was not found in the pkg-config search path"。
          # patchelf / desktop-file-utils 是 AppImage 的 gtk 插件打包时要用到的。
          # 注意不需要 libfuse2：wails3 生成 AppImage 用的是
          # `--appimage-extract-and-run`（internal/commands/appimage.go），
          # 不走 FUSE 挂载，所以 Ubuntu 24.04 默认没有 libfuse2 也能过。
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            patchelf desktop-file-utils

      - name: 确保 NSIS 可用（Windows）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $nsisDir = 'C:\Program Files (x86)\NSIS'

          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::choco install nsis 退出码 $LASTEXITCODE，继续尝试解析 makensis"
            }
            # choco 只把 NSIS 目录写进【注册表里的机器级 PATH】，而当前 pwsh 进程的环境块
            # 在步骤启动时就固定了，改注册表不会回灌进来 —— 所以安装成功之后立刻
            # Get-Command 依然找不到它。必须从注册表重新读一遍拼回 $env:Path。
            $env:Path = "$nsisDir;" +
              [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
              [Environment]::GetEnvironmentVariable('Path', 'User')
          }

          # 给【后续步骤】用（wails3 task windows:package → create:nsis:installer 里直接调
          # makensis）。GITHUB_PATH 的生效时机是下一步，救不了当前进程，两者都得写。
          if (Test-Path $nsisDir) {
            $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

          # 兜底：万一没生成 shim 也没进 PATH，按约定路径直接取，
          # 免得错误以 "makensis is not recognized" 的形式埋在打包步骤深处。
          $found = Get-Command makensis -ErrorAction SilentlyContinue
          $exe = if ($found) { $found.Source } else { $null }
          if (-not $exe) {
            $candidate = Join-Path $nsisDir 'makensis.exe'
            if (-not (Test-Path $candidate)) { throw "NSIS 安装后仍找不到 makensis，安装似乎失败了" }
            $exe = $candidate
          }

          "makensis: $exe"
          & $exe /VERSION
          if ($LASTEXITCODE -ne 0) { throw "makensis 无法执行：$exe" }

      # ------------------------------------------------------- wails3 CLI 版本锁定

      - name: 解析 go.mod 锁定的 wails3 版本
        id: wails
        shell: bash
        run: |
          set -euo pipefail
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          echo "锁定版本：$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 安装并校验 wails3 CLI
        shell: bash
        run: |
          set -euo pipefail
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${{ steps.wails.outputs.version }}"

          # CLI 与库是两份独立安装，版本不一致时 wails3 会以
          # "flag provided but not defined" 之类的方式报错，报错点离原因很远
          # （旧 CLI 不认识脚手架生成的新 flag）。这里当场对齐、当场断言。
          got=$(wails3 version 2>&1 | tr -d '\r')
          # 大括号不能省：macOS 的 /bin/bash 是 3.2，变量名后紧跟中文全角字符时
          # 它会把该字符的首字节并进变量名，于是 `$got（` 被解析成一个叫 "got<乱码>"
          # 的未定义变量，在 set -u 下直接 "unbound variable" 退出。
          # Linux 的 bash 5.x 解析正确，所以只有 macOS 这条会挂。
          echo "wails3 = ${got}（需要 ${{ steps.wails.outputs.version }}）"
          if [ "$got" != "${{ steps.wails.outputs.version }}" ]; then
            echo "::error::wails3 CLI 版本不匹配：$got != ${{ steps.wails.outputs.version }}"
            exit 1
          fi
          echo "wails3 路径：$(command -v wails3)"

      # -------------------------------------------------------------------- 打包

      - name: 同步版本号到打包元数据
        # 运行时只认 internal/version.Version，而安装包元数据在 config.yml /
        # info.json / Info.plist / nfpm.yaml 里。两者不一致时局域网更新会
        # 「广播 1.0.1、包里是 1.0.0」，装完还是旧版 → 再拉一次的死循环。
        run: go run ./scripts/vergen

      - name: 打包
        # 不指定 shell：Windows 用 pwsh、Linux/macOS 用 bash，各取所长。
        # EXTRA_TAGS=wails 由作业级 env 继承下来。
        run: wails3 task ${{ matrix.task }}

      - name: 生成 dmg（macOS）
        if: matrix.os == 'macos-latest'
        run: wails3 task darwin:create:dmg

      - name: 核对产物（防占位程序回归）
        shell: bash
        run: |
          set -euo pipefail
          ls -lh bin/
          # 占位程序约 2.4MB，真实客户端十几 MB 起。
          # 这是本项目最隐蔽的失败模式：构建成功、安装包正常、装上去是空壳。
          size=$(wc -c < bin/SwarmLink.exe 2>/dev/null || wc -c < bin/SwarmLink)
          if [ "$size" -lt 5000000 ]; then
            echo "::error::产物只有 $((size / 1024 / 1024))MB，几乎肯定是占位程序（EXTRA_TAGS 没生效）"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SwarmLink-${{ matrix.label }}
          # 三个平台的产物都落在 bin/：
          #   Windows  bin/SwarmLink.exe + bin/SwarmLink-amd64-installer.exe
          #   Linux    bin/SwarmLink + *.AppImage / *.deb / *.rpm / *.pkg.tar.zst
          #   macOS    bin/SwarmLink.app + bin/*.dmg
          path: bin/
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 必须有：gh release create 是"在 git 仓库里"工作的 —— 它要解析 tag。
      # 这个作业里只有 download-artifact，工作目录下没有 .git 时 gh 会直接抛
      # "failed to run git: fatal: not a git repository"。
      #
      # fetch-depth: 0：下面要 git describe 找上一个 tag，用来拼「完整变更」链接。
      # 默认的浅克隆只有 1 个 commit，取不到任何 tag。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 列出待发布文件
        run: find dist -type f | sort

      # ------------------------------------------------------------ 发布说明素材

      # tag 与二进制里的版本号必须一致。
      #
      # 这不是洁癖：局域网更新只认内嵌的 internal/version.Version。tag 写成
      # v0.1.6、二进制广播 0.1.5 时，装完仍然是旧版 → 再拉一次的死循环，
      # 而 Release 页面上写着 0.1.6，现场根本对不上号。
      - name: 核对 tag 与 internal/version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          code=$(awk -F'"' '/^const Version = "/{print $2; exit}' internal/version/version.go)
          [ -n "$code" ] || { echo "::error::读不到 internal/version/version.go 里的 Version"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=v$tag，internal/version.Version=$code"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag v$tag 与 internal/version.Version（$code）不一致：局域网更新会按版本号判断谁是新版，装完可能还是旧版。"
            exit 1
          fi

      # 从 CHANGELOG.md 取本节 —— 只取「## [x.y.z]」到下一个「## [」之间的内容。
      #
      # 找不到就【失败】而不是退回 --generate-notes：一份自动生成的提交列表
      # 看起来像说明、实际什么也没说，比没有说明更容易让人以为功能没做。
      - name: 生成发布说明
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail

          awk -v ver="$VERSION" '
            # 用 index 而不是正则：版本号里的 . 在正则里是通配符，
            # 0.1.5 会误匹配 0x1y5 这种根本不存在的小节。
            index($0, "## [" ver "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { lines[++n] = $0 }
            END {
              # 掐掉首尾空行，避免正文一开头就是一大块留白
              start = 1
              while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
              end = n
              while (end >= start && lines[end] ~ /^[[:space:]]*$/) end--
              for (i = start; i <= end; i++) print lines[i]
            }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md 里没有 ## [$VERSION] 小节。发布前请先补上本次更新（新增 / 修复 / 已知问题）。"
            exit 1
          fi

          echo "== 发布说明 =="
          cat notes.md

          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo
            echo '---'
            echo
            echo '### 安装说明'
            echo
            echo '- **macOS**：.dmg 未签名也未公证，首次打开会被 Gatekeeper 拦下。'
            echo '  临时绕过：右键 → 打开，或 `xattr -cr /Applications/SwarmLink.app`。'
            echo '- **Windows**：安装包没有 Authenticode 签名，SmartScreen 会提示「未知发布者」。'
            echo '- 局域网内的机器会自动提示更新；也可以直接下载下面任一安装包覆盖安装。'
            if [ -n "$prev" ]; then
              echo
              echo "**完整变更**：https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
          } >> notes.md

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 只挑真正要发布的安装包/镜像，不能把 dist 下的文件一股脑塞给 gh：
          #   - macOS 的 SwarmLink.app 是【目录树】，download-artifact 会把它还原成
          #     几十个独立文件，全都会变成 Release 上的资产，发布页直接变垃圾场；
          #   - 更要命的是里面的 Contents/MacOS/SwarmLink 与 Linux 的 bin/SwarmLink
          #     完全同名。gh 遇到【多个同名资产】时不会报 422，而是抛一句毫无线索的
          #     "HTTP 404: Not Found (https://uploads.github.com/...?label=&name=SwarmLink)"，
          #     然后把已经建好的 Release 删掉。报错点到原因的距离极远，
          #     见 cli/cli#10734 与 cli/cli#10792。
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(find dist -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) | sort)

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没有任何产物，拒绝创建空 Release"
            exit 1
          fi

          echo "== 准备上传 ${#files[@]} 个文件 =="
          printf '  %s\n' "${files[@]}"

          # 重名必须在这里拦下。上面那套通配符已经排除了 .app 内部，
          # 但只要以后有人往 bin/ 里多塞一个同名产物，这里就会当场报清楚，
          # 而不是又变成一句 "HTTP 404: Not Found"。
          dupes=$(for f in "${files[@]}"; do basename "$f"; done | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::资产重名，gh 对同名文件会以含糊的 HTTP 404 失败："
            printf '  %s\n' "$dupes"
            exit 1
          fi

          # 用数组而不是 $(find ...)：文件名里可能有空格，
          # 直接拼进命令行会被 word splitting 拆散。
          #
          # --notes-file 而不是 --generate-notes：正文是 CHANGELOG 里
          # 人工写的「新增 / 修复」，上一步已经取好并附上了安装说明。
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "${files[@]}"

      # 面向用户的安装提示已经写进 Release 正文（见「生成发布说明」），
      # 这里只留维护者视角的「怎么彻底消除提示」，不重复一遍。
      - name: 维护者提醒（签名与发布说明）
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 关于签名

          当前流水线**没有签名**，因此：

          - **macOS**：.dmg 未签名也未公证，用户首次打开会被 Gatekeeper 拦下。
            临时绕过：右键 → 打开，或 `xattr -cr /Applications/SwarmLink.app`。
          - **Windows**：安装包没有 Authenticode 签名，SmartScreen 会弹"未知发布者"。

          要消除这些提示，需要配置证书：
            - Windows：`wails3 setup signing` + `wails3 task windows:sign:installer`
            - macOS：Apple Developer ID 证书 + `codesign` + `notarytool` 公证

          ## 关于发布说明

          Release 正文取自 `CHANGELOG.md` 中与 tag 同名的小节，发布后可在网页上直接编辑。
          下一次发版记得：先改 `internal/version/version.go` 的 `Version`，再补一节
          `## [x.y.z] - YYYY-MM-DD`，否则流水线会当场失败。
          EOF
