# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "SwarmLink" # The name of the company
  productName: "蜂群" # The name of the application
  productIdentifier: "io.swarmlink.app" # The unique product identifier
  description: "无中心内网 P2P 聊天与文件分享工具" # The application description
  copyright: "(c) 2026, SwarmLink" # Copyright text
  comments: "Local-first, peer-to-peer LAN chat and file transfer" # Comments
  version: "0.1.6" # The application version
  # ⚠️ 不要打开 cfBundleIconName，也不要往 build/appicon.icon 里放模板 .icon：
  # 一旦 darwin/Assets.car 存在，generate build assets 会自动写入
  # CFBundleIconName，而 macOS 12+ 优先用 Assets.car 里的图标，
  # 于是「换了 appicon.png 但 Dock/Finder 图标没变」。
  # 本项目的图标只有一条链路：appicon.png → darwin/icons.icns。

# iOS build configuration (uncomment to customise iOS project generation)
# Note: Keys under `ios` OVERRIDE values under `info` when set.
# ios:
#   # The iOS bundle identifier used in the generated Xcode project (CFBundleIdentifier)
#   bundleID: "com.mycompany.myproduct"
#   # The display name shown under the app icon (CFBundleDisplayName/CFBundleName)
#   displayName: "My Product"
#   # The app version to embed in Info.plist (CFBundleShortVersionString/CFBundleVersion)
#   version: "0.0.1"
#   # The company/organisation name for templates and project settings
#   company: "My Company"
#   # Additional comments to embed in Info.plist metadata
#   comments: "Some Product Comments"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    # `-tags wails` 不能省：入口 main_wails.go 带 `//go:build wails`，不带这个 tag 时
    # 根目录【一个 Go 文件都不剩】，dev 构建会直接以
    #   "build constraints exclude all Go files in <repo>"
    # 失败，然后整个 wails3 dev 进程退出 —— 表现就是"dev 跑不起来"。
    # 开发构建【不能】带 production tag（注意这里确实没有）：assetserver 的
    # build_dev.go 是 `//go:build !production`，带上 production 就丢失
    # FRONTEND_DEVSERVER_URL 支持，界面会去读嵌入的旧 dist，热更新静默失效。
    - cmd: wails3 build -tags wails DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

