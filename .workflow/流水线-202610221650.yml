# ============================================================================
# Gitee Go 流水线：Linux 产物打包 + 发布到 Gitee Releases
# ============================================================================
#
# ⚠ 这份文件【未经线上验证】。原因不是没写，而是 Gitee Go 没有公开的 YAML 规范：
#   - 2020 年官方博客的写法是 `step: golangbuild@1` + `inputs.golangVersion/goals`；
#   - 现行《Golang 构建》帮助页只给表单字段（Go 版本 / 构建命令 / 暂存构建物 /
#     构建缓存），并明确说字段名以流水线界面「YAML 视图」导出的为准；
#   - 该帮助页甚至把 Go 版本误写成 JDK 版本，说明这块文档本身不可靠。
#
#   因此：**必须先按下面「使用方式」在界面里建一次流水线，再粘这份 YAML 逐字段校对。**
#   直接 push 这个文件不会让 Gitee 认识它 —— Gitee Go 的流水线是在界面上注册的。
#
# ---------------------------------------------------------------------------
# 使用方式
# ---------------------------------------------------------------------------
# 1. 仓库 → 服务 → Gitee Go → 新建流水线 → 选 YAML 模式（或建空流水线后编辑）
# 2. 把本文件内容粘进去，然后在「YAML 视图」里逐项核对：
#       - step 标识（golangbuild@1 可能已改名，界面会提示可用插件）
#       - inputs.golangVersion（脚本会自己装 go.mod 要求的版本，这个字段只是初始化）
#       - triggers 的 tag 语法（不确定时有两条退路：改成 branch 触发，或直接点「运行」手动触发）
# 3. 流水线参数里加一个【私密参数】 GITEE_TOKEN：
#       Gitee → 设置 → 私人令牌 → 生成新令牌，勾选 projects 权限
#    （可选参数：GITEE_OWNER、GITEE_REPO_NAME，默认 small_bud_star / swarm-link）
# 4. 保存并手动跑一次。第一次跑请盯着日志，重点看第 3 步（系统依赖）和附件上传。
#
# ---------------------------------------------------------------------------
# 这份流水线【只做 Linux】。这是硬约束，不是偷懒：
# ---------------------------------------------------------------------------
#   - .dmg 的 create:dmg 任务在 build/linux 与 build/darwin 的 Taskfile 里都写了
#     `platforms: [darwin]`，非 macOS 会被直接跳过；.app 的合成还依赖 codesign，
#     否则被 Gatekeeper 拦。→ 没有 macOS Runner 就永远没有 dmg。
#   - Windows 需要 NSIS（makensis）与 WebView2，Gitee 托管构建机以 Linux 为主，
#     Windows 基本要靠自托管 Runner。文件末尾留了模板，你自己有机器时再打开。
#   - 所以三个平台里，Gitee 这条线只能出 4 个 Linux 产物（AppImage/deb/rpm/pkg.tar.zst），
#     Windows 与 macOS 安装包仍然只能来自 GitHub Actions。
#
# ---------------------------------------------------------------------------
# 已知风险（按会踩到的顺序）
# ---------------------------------------------------------------------------
#   1. 构建机若是 Ubuntu 20.04：没有 libgtk-4-dev，第 3 步会当场失败。
#      Wails v3 的 Linux 后端在 beta.24 起是 GTK4 + webkitgtk-6.0，装 GTK3 顶不上。
#   2. AppImage 单个约 81MB，逼近常见 100MB 附件上限 —— 脚本会打印警告，但拦不住平台拒绝。
#      第一次务必确认 81MB 那个文件真的传上去了，再谈自动化。
#   3. 构建机没有 sudo 权限时，apt-get 会失败；脚本已做 root 判断。
#   4. Gitee 的 releases/tags/{tag} 接口若返回 404，脚会退化成「创建新 Release」；
#      同名 tag 已存在时创建会失败，日志里会打印原始响应。
#
# ============================================================================

version: '1.0'
name: gitee-release-linux
displayName: 'Gitee 发布 · Linux 产线'

triggers:
  push:
    branches:
      precise:
        - main
    # 想按 tag 触发时优先用界面里的触发器配置：
    #   tags: { precise: ['v*'] }
    # 该字段在不同版本里写法不一致，界面配完再回来看这里生成的是什么。

stages:
  - stage:
      name: build-and-publish
      displayName: '打包 Linux 产物并发布'
      failFast: true
      steps:
        - step: golangbuild@1
          name: linux-release
          displayName: 'Linux 打包 + 发布 Gitee Release'
          inputs:
            # 只是给插件一个能跑起来的初始环境；真正使用的 Go 版本由下面的脚本
            # 按 go.mod 安装（当前 go.mod 要求 1.26.0，插件下拉里多半没有）。
            # 如果界面里这个插件没有 golangVersion 字段，删掉这行即可。
            golangVersion: 1.21
            goals: |
              set -euo pipefail

              # ================= 0. 参数与版本号 =================
              : "${GITEE_TOKEN:?流水线缺少私密参数 GITEE_TOKEN（Gitee 私人令牌，需勾选 projects 权限）}"
              OWNER="${GITEE_OWNER:-small_bud_star}"
              REPO_NAME="${GITEE_REPO_NAME:-swarm-link}"
              API="https://gitee.com/api/v5/repos/${OWNER}/${REPO_NAME}"
              echo "仓库：${OWNER}/${REPO_NAME}"

              TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              if [ -z "${TAG}" ]; then
                TAG="v0.0.0-dev.$(date +%Y%m%d%H%M)"
                echo "::warning::当前提交没有 tag，使用占位版本 ${TAG}（只能用来验证产线，别对外发）"
              fi
              echo "目标版本：${TAG}"

              # ================= 1. Go（按 go.mod 精确安装）=================
              NEED_GO="$(awk '/^go /{print $2; exit}' go.mod)"
              CUR_GO="$(go version 2>/dev/null | awk '{print $3}' | sed 's/^go//' || true)"
              if [ "${CUR_GO}" != "${NEED_GO}" ]; then
                echo "构建机自带 Go ${CUR_GO:-无}，与 go.mod 要求的 ${NEED_GO} 不一致，改用阿里云镜像安装"
                curl -fsSL -o /tmp/go.tgz "https://mirrors.aliyun.com/golang/go${NEED_GO}.linux-amd64.tar.gz"
                rm -rf "${HOME}/.local/go"
                mkdir -p "${HOME}/.local"
                tar -C "${HOME}/.local" -xzf /tmp/go.tgz
              fi
              export PATH="${HOME}/.local/go/bin:${PATH}"
              export GOPROXY=https://goproxy.cn,direct
              export GOTOOLCHAIN=local
              go version

              # ================= 2. Node（按 frontend/.nvmrc）=================
              NEED_NODE_MAJOR="$(tr -d 'v\r\n' < frontend/.nvmrc | cut -d. -f1)"
              CUR_NODE="$(node -v 2>/dev/null || true)"
              case "${CUR_NODE}" in
                "v${NEED_NODE_MAJOR}".*)
                  echo "Node ${CUR_NODE} 已满足要求"
                  ;;
                *)
                  echo "构建机自带 Node ${CUR_NODE:-无}，安装 v${NEED_NODE_MAJOR}.x（npmmirror）"
                  IDX="https://registry.npmmirror.com/-/binary/node/latest-v${NEED_NODE_MAJOR}.x/"
                  FILE="$(curl -fsSL "${IDX}" | grep -o 'node-v[0-9.]*-linux-x64\.tar\.gz' | head -1 || true)"
                  if [ -z "${FILE}" ]; then
                    echo "::error::npmmirror 上找不到 linux-x64 的 Node v${NEED_NODE_MAJOR}.x"
                    exit 1
                  fi
                  echo "下载 ${FILE}"
                  curl -fsSL -o /tmp/node.tar.gz "${IDX}${FILE}"
                  mkdir -p "${HOME}/.local/node"
                  tar -C "${HOME}/.local/node" --strip-components=1 -xzf /tmp/node.tar.gz
                  export PATH="${HOME}/.local/node/bin:${PATH}"
                  ;;
              esac
              node -v
              npm -v

              # ================= 3. 系统依赖 =================
              # GTK4 + webkitgtk-6.0 是 Wails v3 的 Linux 后端硬要求；
              # patchelf / desktop-file-utils 给 AppImage 用。装 GTK3 一个都顶不上。
              SUDO=""
              if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
              if ! command -v apt-get >/dev/null; then
                echo "::error::构建机不是 Debian/Ubuntu 系，本流水线无法继续（请换构建环境或自托管 Runner）"
                exit 1
              fi
              ${SUDO} apt-get update -qq
              if ! ${SUDO} apt-get install -y -qq --no-install-recommends \
                  build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
                  patchelf desktop-file-utils xz-utils curl ; then
                echo "::error::系统依赖安装失败。最常见原因：构建机是 Ubuntu 20.04，没有 libgtk-4-dev"
                echo "::error::（Wails v3 beta.24 起 Linux 后端要求 GTK4，装 libgtk-3-dev 无效）"
                exit 1
              fi
              pkg-config --modversion gtk4
              pkg-config --modversion webkitgtk-6.0

              # ================= 4. wails3 CLI（版本必须与 go.mod 一致）=================
              WAILS_VER="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
              echo "go.mod 锁定的 wails3：${WAILS_VER}"
              go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VER}"
              export PATH="$(go env GOPATH)/bin:${PATH}"
              GOT_WAILS="$(wails3 version 2>&1 | tr -d '\r')"
              if [ "${GOT_WAILS}" != "${WAILS_VER}" ]; then
                echo "::error::wails3 CLI 版本不匹配：${GOT_WAILS} != ${WAILS_VER}"
                exit 1
              fi

              # ================= 5. 打包（入口与 GitHub Actions 完全一致）=================
              # EXTRA_TAGS=wails 不能省：少了它产物是 2.4MB 的占位程序，
              # 安装包照常生成、装上去打不开 —— 本项目最隐蔽的失败模式。
              # 必须用环境变量而不是 `-tags`，因为 wails3 package 的参数里没有 tags，
              # 只有环境变量能穿透 package → create:nsis → deps: build 这条链。
              export EXTRA_TAGS=wails
              go run ./scripts/vergen
              wails3 task linux:package

              ls -lh bin/
              if [ ! -f bin/SwarmLink ]; then
                echo "::error::bin/SwarmLink 不存在，打包没有产出主程序"
                exit 1
              fi
              BIN_SIZE="$(wc -c < bin/SwarmLink)"
              if [ "${BIN_SIZE}" -lt 5000000 ]; then
                echo "::error::主程序只有 $((BIN_SIZE / 1024 / 1024))MB，几乎肯定是 EXTRA_TAGS 没生效的占位程序"
                exit 1
              fi

              # ================= 6. 发布到 Gitee Release =================
              SHA_LIST="$(sha256sum bin/*.AppImage bin/*.deb bin/*.rpm bin/*.pkg.tar.zst 2>/dev/null || true)"
              if [ -z "${SHA_LIST}" ]; then
                echo "::error::bin/ 下没有任何 Linux 安装包"
                exit 1
              fi
              echo "${SHA_LIST}"

              BODY="$(printf '## %s\n\nLinux 产物。Windows 与 macOS 安装包见 GitHub Release。\n\n```\n%s\n```\n' "${TAG}" "${SHA_LIST}")"

              # 先按 tag 查；查不到再创建（接口不可用时会在日志里暴露原始响应）
              RELEASE_ID="$(curl -fsS "${API}/releases/tags/${TAG}" 2>/dev/null \
                | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)"

              if [ -z "${RELEASE_ID:-}" ]; then
                echo "未找到 ${TAG} 的 Release，创建中"
                RESP="$(curl -sS -X POST "${API}/releases" \
                  -d "access_token=${GITEE_TOKEN}" \
                  -d "tag_name=${TAG}" \
                  -d "name=${TAG}" \
                  -d "target_commitish=main" \
                  --data-urlencode "body=${BODY}" || true)"
                RELEASE_ID="$(printf '%s' "${RESP}" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)"
                if [ -z "${RELEASE_ID:-}" ]; then
                  echo "::error::创建 Release 失败，原始响应如下："
                  printf '%s\n' "${RESP}"
                  exit 1
                fi
              fi
              echo "Release ID：${RELEASE_ID}"

              for f in bin/*.AppImage bin/*.deb bin/*.rpm bin/*.pkg.tar.zst; do
                [ -f "${f}" ] || continue
                SIZE_MB=$(( $(wc -c < "${f}") / 1024 / 1024 ))
                if [ "${SIZE_MB}" -gt 95 ]; then
                  echo "::warning::$(basename "${f}") 有 ${SIZE_MB}MB，很接近 Gitee 单附件上限，可能被拒"
                fi
                echo "上传 $(basename "${f}")（${SIZE_MB}MB）"
                if ! curl -fsS -X POST "${API}/releases/${RELEASE_ID}/attach_files" \
                    -F "access_token=${GITEE_TOKEN}" \
                    -F "file=@${f}" > /tmp/attach.log 2>&1; then
                  echo "::error::上传 $(basename "${f}") 失败："
                  cat /tmp/attach.log
                  exit 1
                fi
              done

              echo "完成：${API}/releases/tag/${TAG}"

# ----------------------------------------------------------------------------
# Windows 产线模板（默认注释掉）
#
# 打开它的前提：你在 Gitee 上注册了一台 Windows 自托管 Runner，且该机器已装
#   1) Go（与 go.mod 一致）  2) Node（与 frontend/.nvmrc 一致）
#   3) NSIS（makensis 在 PATH 里）  4) WebView2 Runtime
